stages: [verify, source, build, release-test, repository-test, release, repository-check, deploy]

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

default:
  interruptible: true
  timeout: 30 minutes

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONFAULTHANDLER: "1"
  QT_QPA_PLATFORM: offscreen

verify:
  stage: verify
  image: fedora:43
  before_script:
    - dnf install -y --setopt=install_weak_deps=False git make diffutils gobject-introspection python3 python3-pip python3-pyside6 python3-gobject plasma-integration libayatana-appindicator-gtk3 libsecret libnotify dbus-daemon dbus-tools xorg-x11-server-Xvfb xorg-x11-xauth desktop-file-utils libxml2 util-linux
    - python3 -m venv --system-site-packages .venv
    - .venv/bin/pip install -e '.[dev]'
  script:
    - .venv/bin/ruff check src tests scripts
    - timeout --kill-after=5s 180s prlimit --as=2147483648 -- xvfb-run -a env PYTHONPATH=src TAILTRAY_TEST_NATIVE_MENU=1 TAILTRAY_TEST_STRICT=1 .venv/bin/python -m pytest -q --junitxml=reports/unit.xml --cov=tailtray --cov-branch --cov-report=term-missing --cov-report=xml:reports/coverage.xml
    - make static-check
    - .venv/bin/python -m build
  artifacts:
    when: always
    expire_in: 1 week
    paths: [dist/, reports/]
    reports:
      junit: reports/unit.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage.xml
  coverage: '/TOTAL\s+\d+\s+\d+\s+\d+\s+\d+\s+(\d+(?:\.\d+)?%)/'

source:
  stage: source
  image: python:3.13-slim-trixie
  dependencies: []
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends git
  script:
    - bash scripts/build-packages.sh source
  artifacts:
    expire_in: 30 days
    paths: [dist/]

rpm:
  stage: build
  parallel:
    matrix:
      - TARGET_DISTRO: fedora43
        BUILD_IMAGE: fedora:43
      - TARGET_DISTRO: fedora44
        BUILD_IMAGE: fedora:44
  image: $BUILD_IMAGE
  needs: [source]
  before_script:
    - dnf install -y --setopt=install_weak_deps=False git rpm-build python3 curl
  script:
    - bash scripts/build-packages.sh rpm
    - rpm -qpl dist/*.rpm
    - bash scripts/smoke-package.sh rpm
    - bash scripts/test-installed-package.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths: [dist/*.rpm, reports/]
    reports:
      junit: reports/runtime-*.xml

deb:
  stage: build
  parallel:
    matrix:
      - TARGET_DISTRO: debian13
        BUILD_IMAGE: debian:trixie-slim
      - TARGET_DISTRO: ubuntu26.04
        BUILD_IMAGE: ubuntu:26.04
  image: $BUILD_IMAGE
  needs: [source]
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends git python3 dpkg-dev debhelper-compat fakeroot make build-essential curl ca-certificates
  script:
    - bash scripts/build-packages.sh deb
    - dpkg-deb --contents dist/*.deb
    - bash scripts/smoke-package.sh deb
    - bash scripts/test-installed-package.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths: [dist/*.deb, reports/]
    reports:
      junit: reports/runtime-*.xml

# Run on branches/MRs too: signing, metadata and history bugs are caught before
# creating a protected tag. The ephemeral TEST key is never a release key.
release-rehearsal:
  stage: release-test
  image: fedora:43
  needs: [source, rpm, deb]
  variables:
    TAILTRAY_REHEARSAL_CONTAINER: "1"
  before_script:
    - dnf install -y --setopt=install_weak_deps=False git python3 gnupg2 rpm-sign createrepo_c dpkg
  script:
    - export SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
    - timeout --kill-after=5s 180s python3 tests/release_rehearsal.py --artifacts dist --output public-test
  artifacts:
    expire_in: 1 week
    paths: [public-test/]

repository-rehearsal:
  stage: repository-test
  parallel:
    matrix:
      - TARGET_DISTRO: fedora43
        BUILD_IMAGE: fedora:43
      - TARGET_DISTRO: fedora44
        BUILD_IMAGE: fedora:44
      - TARGET_DISTRO: debian13
        BUILD_IMAGE: debian:trixie-slim
      - TARGET_DISTRO: ubuntu26.04
        BUILD_IMAGE: ubuntu:26.04
  image: $BUILD_IMAGE
  needs: [release-rehearsal]
  variables:
    TAILTRAY_REPOSITORY_DIR: public-test
  script:
    - timeout --kill-after=5s 180s bash scripts/check-native-repository.sh

release:
  stage: release
  image: fedora:43
  needs: [source, rpm, deb, repository-rehearsal]
  interruptible: false
  resource_group: tailtray-release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
  before_script:
    - dnf install -y --setopt=install_weak_deps=False git python3 gnupg2 rpm-sign createrepo_c dpkg
  script:
    - bash scripts/release-ci.sh
  artifacts:
    expire_in: 30 days
    paths: [dist/, public/]

repository-check:
  stage: repository-check
  parallel:
    matrix:
      - TARGET_DISTRO: fedora43
        BUILD_IMAGE: fedora:43
      - TARGET_DISTRO: fedora44
        BUILD_IMAGE: fedora:44
      - TARGET_DISTRO: debian13
        BUILD_IMAGE: debian:trixie-slim
      - TARGET_DISTRO: ubuntu26.04
        BUILD_IMAGE: ubuntu:26.04
  image: $BUILD_IMAGE
  needs: [release]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
  script:
    - bash scripts/check-native-repository.sh

package-repository:
  stage: deploy
  image: python:3.13-slim-trixie
  needs:
    - job: release
    - job: repository-check
      artifacts: false
  interruptible: false
  resource_group: tailtray-release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true" && $TAILTRAY_PUBLISH_REPOSITORY == "1"'
  script:
    - python3 scripts/check-repository-deploy.py
  pages:
    publish: public
