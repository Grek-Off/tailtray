name: Feature request
description: Suggest a focused improvement to TailTray.
title: "[Feature]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Please search existing requests first. Do not include credentials,
        tokens, login URLs, private IPs, or unredacted diagnostic output.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change and how it would work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or other approaches have you considered?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add relevant distro, desktop, or Tailscale versions and redacted examples.
    validations:
      required: false
