name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: tailtray-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: ${{ github.workspace }}
  CI_COMMIT_TAG: ${{ github.ref_name }}
  TAILTRAY_SIGNING_FINGERPRINT: D432326D1167240864F8345763FA04F99681DA62

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  prepare:
    needs: checks
    runs-on: ubuntu-24.04
    container:
      image: fedora:43
      options: --cpus=2 --memory=4g
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    steps:
      - name: Install signing dependencies before checkout
        run: dnf install -y --setopt=install_weak_deps=False git python3 gnupg2 rpm-sign createrepo_c dpkg
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Sign complete package matrix and prepare draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAILTRAY_SIGNING_KEY: ${{ secrets.TAILTRAY_SIGNING_KEY }}
        run: timeout --kill-after=5s 900s bash scripts/github-release-ci.sh
      - name: Upload signed repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-repository
          path: public/
          if-no-files-found: error
          retention-days: 30
      - name: Upload signed release inputs for final verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-release
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Prepare Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public/

  repository:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fedora43
            image: fedora:43
          - target: fedora44
            image: fedora:44
          - target: debian13
            image: debian:trixie-slim
          - target: ubuntu26.04
            image: ubuntu:26.04
    container:
      image: ${{ matrix.image }}
      options: --cpus=2 --memory=3g
    timeout-minutes: 15
    env:
      TARGET_DISTRO: ${{ matrix.target }}
      TAILTRAY_REPOSITORY_DIR: public
    steps:
      - name: Install consumer dependencies before checkout
        run: |
          if [[ $TARGET_DISTRO == fedora* ]]; then
            dnf install -y --setopt=install_weak_deps=False git curl-minimal gnupg2 python3
          else
            apt-get update -qq
            apt-get install -y --no-install-recommends git curl ca-certificates gnupg python3
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-repository
          path: public
      - name: Verify actual signed native repository
        run: timeout --kill-after=5s 240s bash scripts/check-native-repository.sh

  pages:
    needs: repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy signed APT and DNF repositories
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  anonymous-consumer:
    needs: pages
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fedora43
            image: fedora:43
          - target: fedora44
            image: fedora:44
          - target: debian13
            image: debian:trixie-slim
          - target: ubuntu26.04
            image: ubuntu:26.04
    container:
      image: ${{ matrix.image }}
      options: --cpus=2 --memory=3g
    timeout-minutes: 15
    env:
      TARGET_DISTRO: ${{ matrix.target }}
      TAILTRAY_NATIVE_REPOSITORY_URL: https://grek-off.github.io/tailtray
    steps:
      - name: Install consumer dependencies before checkout
        run: |
          if [[ $TARGET_DISTRO == fedora* ]]; then
            dnf install -y --setopt=install_weak_deps=False git curl-minimal gnupg2 python3
          else
            apt-get update -qq
            apt-get install -y --no-install-recommends git curl ca-certificates gnupg python3
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download tagged packages anonymously through APT and DNF
        run: timeout --kill-after=5s 300s bash scripts/check-native-repository.sh

  finalize:
    needs: anonymous-consumer
    runs-on: ubuntu-24.04
    container:
      image: fedora:43
      options: --cpus=2 --memory=3g
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - name: Install verification dependencies before checkout
        run: dnf install -y --setopt=install_weak_deps=False git python3 gnupg2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-repository
          path: public
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-release
          path: dist
      - name: Verify all immutable assets and publish complete release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          trap 'gpgconf --kill all >/dev/null 2>&1 || true; rm -rf -- "$GNUPGHOME"' EXIT
          timeout --kill-after=5s 600s python3 scripts/github_release.py repository --directory public --release-directory dist
